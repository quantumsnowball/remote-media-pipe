[package]
name = "remote-media-pipe"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "remote-media-pipe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4"] }
