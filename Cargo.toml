[package]
name = "remote-media-pipe"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "remote-media-pipe"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
log = "0.4.34"
mime_guess = "2.0.5"
russh = "0.63.3"
russh-sftp = "3.0.0"
socket2 = "0.6.5"
ssh2-config = "0.8.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.1", features = ["fs"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.0", features = ["v4"] }
